<title>Roast &amp; Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --void:#0c0810;
    --stage-a:#140d1a;
    --stage-b:#08050c;
    --surface:#18101f;
    --surface-2:#201727;
    --surface-3:#2b2032;
    --ink:#f7eef5;
    --ink-dim:#b6a2b6;
    --ink-faint:#7c6a7c;
    --line:rgba(247,238,245,0.09);
    --shadow:rgba(4,2,6,0.6);
    --brand:#ff1f5e;
    --ember:#ff5f45;
    --ember-ink:#3a140b;
    --rose:#ff3d68;
    --violet:#a78bfa;
    --glow:#2fe0bd;
    --gold:#ffcf56;
    --sky:#38bdf8;
    --lime:#a3e635;
    --fuchsia:#e879f9;
    --indigo:#6366f1;
    --tangerine:#fb923c;
    --cyan:#06b6d4;
    --blush:#ff6fa5;
    --periwinkle:#7c9cf0;
    --font-display:'Anton', system-ui, sans-serif;
    --font-body:'Karla', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  body{
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-body);
    min-height:100%;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: clamp(16px, 4vw, 48px) 16px 64px;
    overflow-x:hidden;
    background:
      radial-gradient(60% 50% at 20% 0%, rgba(255,31,94,0.18), transparent 60%),
      radial-gradient(55% 45% at 85% 10%, rgba(47,224,189,0.11), transparent 60%),
      linear-gradient(180deg, var(--stage-a), var(--stage-b));
  }

  .blob{
    position:fixed;
    width:38vmax; height:38vmax;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }
  .blob-a{ background:var(--brand); top:-12vmax; left:-10vmax; animation: drift-a 26s ease-in-out infinite alternate; }
  .blob-b{ background:var(--glow); bottom:-14vmax; right:-12vmax; animation: drift-b 30s ease-in-out infinite alternate; }
  @keyframes drift-a{ from{ transform:translate(0,0); } to{ transform:translate(6vmax, 4vmax); } }
  @keyframes drift-b{ from{ transform:translate(0,0); } to{ transform:translate(-5vmax, -5vmax); } }
  @media (prefers-reduced-motion: reduce){
    .blob-a, .blob-b{ animation:none; }
  }

  .console{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    background: linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--surface-2));
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow: 0 30px 70px -20px var(--shadow), 0 1px 0 rgba(255,255,255,0.04) inset;
    padding: 26px 22px 28px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  header.brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand-mark{
    display:flex;
    flex-direction:column;
    gap:2px;
    line-height:1;
  }
  .brand-title{
    font-family:var(--font-display);
    font-weight:400;
    font-size: clamp(21px, 5vw, 25px);
    letter-spacing:0.01em;
    text-transform:uppercase;
    display:flex; align-items:baseline; gap:6px;
  }
  .brand-title .amp{ color:var(--brand); }
  .brand-tag{
    font-size:12px;
    color:var(--ink-faint);
    letter-spacing:0.02em;
    font-style:italic;
  }
  .players-pill{
    font-family:var(--font-body);
    font-weight:600;
    font-size:12px;
    color:var(--ink-dim);
    background:var(--surface-3);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  #screen{ display:flex; flex-direction:column; }
  .fade-in{ display:flex; flex-direction:column; gap:20px; animation: fadeIn 0.35s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .fade-in{ animation:none; } }

  h2.screen-title{
    font-family:var(--font-display);
    font-weight:400;
    font-size:23px;
    letter-spacing:0.01em;
    margin:0;
    text-wrap:balance;
  }
  p.screen-sub{ margin:0; color:var(--ink-dim); font-size:14px; line-height:1.5; }
  .progress-note{ font-size:13px; font-weight:600; color:var(--ink-faint); }
  p.kbd-hint{ margin:6px 0 0; text-align:center; font-size:12px; color:var(--ink-faint); }

  .field-row{ display:flex; gap:10px; }
  .input, .textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    border-radius:14px;
    padding:12px 14px;
  }
  .textarea{ resize:vertical; min-height:64px; line-height:1.5; }
  .input:focus, .textarea:focus, button:focus-visible, .name-btn:focus-visible{
    outline:2px solid var(--glow);
    outline-offset:2px;
  }
  .input::placeholder, .textarea::placeholder{ color:var(--ink-faint); }

  button{ font-family:var(--font-body); border:none; cursor:pointer; color:var(--ink); }
  .btn{
    background:var(--surface-3);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
    font-weight:600;
    font-size:14px;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background: linear-gradient(180deg, var(--brand), #c9003f);
    color:#2b0010;
    font-weight:700;
    box-shadow: 0 10px 24px -10px rgba(255,31,94,0.55);
  }
  .btn-block{ width:100%; text-align:center; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-dim); }
  .btn[disabled]{ opacity:0.4; cursor:not-allowed; }
  .btn-lg{ padding:16px; font-size:16px; }

  .chip-list{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 10px 8px 16px;
    font-size:14px;
    font-weight:600;
  }
  .chip button.chip-remove{
    background:var(--surface-3);
    color:var(--ink-faint);
    width:20px; height:20px;
    border-radius:50%;
    font-size:12px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .hint{ font-size:12px; color:var(--ink-faint); }

  .depth-field{ display:flex; flex-direction:column; gap:10px; }
  .depth-field label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); }
  .depth-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .rule5-row{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .depth-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 8px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    text-align:center;
  }
  .depth-btn.active{ background: color-mix(in srgb, var(--glow) 20%, var(--surface-2)); border-color: color-mix(in srgb, var(--glow) 55%, transparent); }
  .depth-emoji{ font-size:18px; }
  .depth-label{ font-family:var(--font-display); font-size:13px; letter-spacing:0.01em; }
  .depth-tagline{ font-size:10px; color:var(--ink-faint); line-height:1.3; }

  .afterdark-toggle{
    display:flex; align-items:center; gap:14px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    text-align:left;
    width:100%;
  }
  .afterdark-toggle.active{ background: color-mix(in srgb, var(--rose) 16%, var(--surface-2)); border-color: color-mix(in srgb, var(--rose) 45%, var(--line)); }
  .afterdark-text{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .afterdark-title{ font-weight:700; font-size:14px; }
  .afterdark-sub{ font-size:11px; color:var(--ink-faint); line-height:1.4; }
  .afterdark-switch{
    flex:none;
    width:44px; height:26px;
    border-radius:999px;
    background:var(--surface-3);
    border:1px solid var(--line);
    position:relative;
    transition: background 0.15s ease;
  }
  .afterdark-knob{
    position:absolute; top:2px; left:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--ink-faint);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .afterdark-toggle.active .afterdark-switch{ background:var(--rose); }
  .afterdark-toggle.active .afterdark-knob{ transform:translateX(18px); background:#fff; }

  details.customize{ background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:6px 16px; }
  details.customize summary{ cursor:pointer; padding:14px 0; font-weight:600; font-size:14px; color:var(--ink-dim); list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  details.customize summary::-webkit-details-marker{ display:none; }
  details.customize summary:after{ content:'+'; font-size:18px; color:var(--ink-faint); }
  details.customize[open] summary:after{ content:'\2212'; }
  .fake-summary{ cursor:pointer; padding:14px 0; font-weight:600; font-size:14px; color:var(--ink-dim); display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; background:none; border:none; text-align:left; font-family:var(--font-body); }
  .fake-summary-icon{ font-size:18px; color:var(--ink-faint); }
  .custom-field{ margin:0 0 18px; display:flex; flex-direction:column; gap:8px; }
  .howto-section{ margin:0 0 20px; }
  .howto-section:last-child{ margin-bottom:14px; }
  .howto-heading{ font-family:var(--font-display); font-size:14px; letter-spacing:0.02em; color:var(--ink); margin:0 0 8px; }
  .howto-p{ margin:0 0 8px; font-size:13.5px; line-height:1.55; color:var(--ink-dim); }
  .howto-mode{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
  .howto-mode:last-child{ border-bottom:none; }
  .howto-mode-icon{ flex:none; font-size:18px; line-height:1.4; }
  .howto-mode-name{ font-weight:700; font-size:13.5px; color:var(--ink); }
  .howto-mode-desc{ font-size:13px; line-height:1.5; color:var(--ink-dim); }

  .custom-field label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); }

  .players-row{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 4px; }
  .score-chip{
    flex:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:10px 16px; min-width:64px;
  }
  .score-chip .name{ font-size:12px; font-weight:600; color:var(--ink-dim); white-space:nowrap; }
  .score-chip .total{ font-family:var(--font-display); font-size:18px; font-variant-numeric:tabular-nums; }

  .turn-banner{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
  }
  .turn-banner .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); font-weight:700; }
  .turn-banner .name{ font-family:var(--font-display); font-size:17px; }

  .mode-section{ display:flex; flex-direction:column; gap:10px; }
  .mode-section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin:0; font-family:var(--font-body); }
  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .mode-card{
    grid-column:span 1;
    text-align:left;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    display:flex; flex-direction:column; gap:12px;
  }
  .mode-card.wide{ grid-column:1 / -1; flex-direction:row; align-items:center; }
  .mode-icon{
    width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
    background: color-mix(in srgb, var(--mc) 22%, var(--surface-3));
    border:1px solid color-mix(in srgb, var(--mc) 40%, transparent);
  }
  .mode-title{ font-family:var(--font-display); font-weight:400; font-size:16px; letter-spacing:0.01em; }
  .mode-desc{ font-size:12px; color:var(--ink-dim); line-height:1.4; }

  .prompt-card{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    display:flex; flex-direction:column; gap:12px;
  }
  .kicker{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em;
    color: var(--mc);
  }
  .prompt-text{ font-family:var(--font-display); font-size:20px; line-height:1.4; text-wrap:balance; }
  .cover-card{
    text-align:center;
    background:var(--surface-2);
    border:1px dashed var(--line);
    border-radius:18px;
    padding:36px 20px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .cover-card .big-emoji{ font-size:34px; }

  .name-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .name-btn{
    background:var(--surface-3);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
  }
  .name-btn:active{ transform:scale(0.96); }

  .result-banner{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex; flex-direction:column; gap:4px;
  }
  .result-banner .headline{ font-family:var(--font-display); font-size:17px; }
  .result-banner .sub{ font-size:13px; color:var(--ink-dim); }

  .timer-num{
    font-family:var(--font-display);
    font-size:64px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    padding:14px 0;
  }
  .timer-num.urgent{ color:var(--rose); animation:pulse 1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .timer-num.urgent{ animation:none; } }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }

  .bomb-icon{ font-size:56px; text-align:center; animation: bombPulse 0.9s ease-in-out infinite; }
  @keyframes bombPulse{ 0%,100%{ transform:scale(1) rotate(-2deg); } 50%{ transform:scale(1.12) rotate(2deg); } }
  @media (prefers-reduced-motion: reduce){ .bomb-icon{ animation:none; } }

  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  .empty-state{ text-align:center; padding:24px 8px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .empty-state .big-emoji{ font-size:32px; }

  .awards-mvp{
    position:relative;
    text-align:center;
    background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 18%, var(--surface-2)), var(--surface-2));
    border:1px solid color-mix(in srgb, var(--gold) 45%, var(--line));
    border-radius:20px;
    padding:26px 18px 22px;
    overflow:hidden;
  }
  .awards-mvp .crown{ font-size:30px; }
  .awards-mvp .name{ font-family:var(--font-display); font-size:22px; margin-top:4px; }
  .awards-mvp .caption{ font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px; }
  .confetti span{
    position:absolute; font-size:16px; opacity:0.85;
    animation: bob 3.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .confetti span{ animation:none; } }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-8px) rotate(8deg); } }

  .answer-list{ display:flex; flex-direction:column; gap:8px; }
  .answer-row{
    display:flex; align-items:baseline; gap:10px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
  }
  .answer-row .num{ flex:none; color:var(--ink-faint); font-weight:700; }
  .answer-row.real{ border-color: color-mix(in srgb, var(--mc) 55%, var(--line)); background: color-mix(in srgb, var(--mc) 14%, var(--surface-2)); }

  .awards-list{ display:flex; flex-direction:column; gap:10px; }
  .awards-row{
    display:flex; align-items:center; gap:14px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
  }
  .awards-row.muted{ opacity:0.5; }
  .awards-row .medal{ font-size:20px; width:26px; text-align:center; }
  .awards-row .info{ flex:1; }
  .awards-row .award-title{ font-weight:700; font-size:13px; }
  .awards-row .award-winner{ font-size:12px; color:var(--ink-dim); }
  .awards-row .count{ font-family:var(--font-display); font-size:16px; color:var(--ink-dim); }
  .stat-line{ font-size:12px; color:var(--ink-faint); text-align:center; }

  .remote-list{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .remote-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:14px; }
  .remote-row.done{ border-color:var(--glow); color:var(--ink); }
  .remote-row .btn-sm{ padding:6px 10px; font-size:12px; }
  .connect-code{ font-family:var(--font-display); font-size:36px; letter-spacing:0.12em; text-align:center; }
  .connect-qr{ display:block; margin:16px auto; border-radius:12px; background:#fff; padding:8px; }
  .join-wrap{ max-width:420px; margin:0 auto; padding:24px 20px; }
  .join-name-btn{ display:block; width:100%; text-align:left; }

  @media (max-width:340px){
    .mode-grid{ grid-template-columns:1fr; }
  }
</style>

    customPrompts: Object.assign({ mlt:[], truth:[], dare:[], guess:[] }, saved.customPrompts || {}),
    depth: saved.depth || 'real',
    rule5Level: saved.rule5Level || 'mix',
    settingsOpen: false,
    afterDark: saved.afterDark || false,
    stats: { guessRoundsPlayed: 0, guessRoundsCorrect: 0, hotseatRoundsPlayed: 0, hotseatRoundsCorrect: 0 },
    connectPhones: false,
    session: null
  };

  function newPlayer(name){
    return { id: uid(), name: name, scores: { mlt:0, truth:0, dare:0, charades:0, mystery:0 } };
  }
  function totalScore(p){
    return p.scores.mlt + p.scores.truth + p.scores.dare + p.scores.charades + p.scores.mystery;
  }
  function knowEachOtherStat(){
    var played = state.stats.guessRoundsPlayed + state.stats.hotseatRoundsPlayed;
    var correct = state.stats.guessRoundsCorrect + state.stats.hotseatRoundsCorrect;
    if (played === 0) return null;
    return { played: played, correct: correct, pct: Math.round(100 * correct / played) };
  }
  function knowEachOtherLine(prefix){
    var s = knowEachOtherStat();
    if (!s) return '';
    var label = state.players.length === 2
      ? '💕 How well do you two know each other? ' + s.correct + ' of ' + s.played + ' correct (' + s.pct + '%).'
      : (prefix || 'The group') + ' read each other correctly ' + s.correct + ' of ' + s.played + ' times (' + s.pct + '%).';
    return '<div class="stat-line">' + label + '</div>';
  }
  function currentPlayer(){
    if (!state.players.length) return null;
    return state.players[state.turnIndex % state.players.length];
  }

  // ---- Connect Phones (multi-device QR) ----
  function genRoomCode(){
    var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I
    var out = '';
    for (var i = 0; i < 5; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
    return out;
  }
  function createSession(){
    if (!firebaseDb) {
      alert('Could not connect to the server. Continuing with pass-the-phone mode.');
      state.connectPhones = false;
      state.screen = 'hub';
      render();
      return;
    }
    var code = genRoomCode();
    var playersMap = {};
    state.players.forEach(function(p){ playersMap[p.id] = { name: p.name, claimed: false }; });
    var ref = firebaseDb.collection('sessions').doc(code);
    var expires = new Date(Date.now() + 24 * 60 * 60 * 1000);
    state.session = { code: code, ref: ref, connected: false, data: null, roundId: null, unsub: null };
    ref.set({
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      expiresAt: firebase.firestore.Timestamp.fromDate(expires),
      players: playersMap,
      round: null
    }).then(function(){
      if (!state.session) return; // user backed out before this resolved
      state.session.connected = true;
      state.session.unsub = ref.onSnapshot(function(snap){
        if (snap.exists) handleSessionUpdate(snap.data());
      }, function(err){ console.warn('session listen error', err); });
      render();
    }).catch(function(err){
      console.warn('session create failed', err);
      state.session = null;
      state.connectPhones = false;
      alert('Could not connect (check your internet connection). Continuing with pass-the-phone mode.');
      state.screen = 'hub';
      render();
    });
  }
  function isClaimed(pid){
    return !!(state.session && state.session.connected && state.session.data &&
      state.session.data.players && state.session.data.players[pid] && state.session.data.players[pid].claimed);
  }
  function startRemoteRound(kind, prompt){
    if (!state.session || !state.session.connected) return;
    var roundId = uid();
    state.session.roundId = roundId;
    state.session.ref.set({ round: { kind: kind, roundId: roundId, prompt: prompt, answers: {} } }, { merge: true })
      .catch(function(err){ console.warn('round write failed', err); });
  }
  function startRemoteWhisper(kind, question, targetPlayerId){
    if (!state.session || !state.session.connected) return;
    var roundId = uid();
    state.session.roundId = roundId;
    state.session.ref.set({ round: { kind: kind, roundId: roundId, prompt: question, targetPlayerId: targetPlayerId, ack: false } }, { merge: true })
      .catch(function(err){ console.warn('whisper round write failed', err); });
  }
  function completeBottleWhisper(){ state.modeState.phase = 'flip'; }
  function completeParanoiaWhisper(){ state.modeState.phase = 'open'; advanceTurn(); }
  function computeVoteTally(ms){
    var tally = {};
    ms.votes.forEach(function(v){ tally[v.targetId] = (tally[v.targetId] || 0) + 1; });
    var maxVotes = Math.max.apply(null, Object.values(tally));
    var topIds = Object.keys(tally).filter(function(id){ return tally[id] === maxVotes; });
    ms.tally = tally;
    ms.maxVotes = maxVotes;
    ms.topIds = topIds;
    ms.votersRevealed = false;
    ms.phase = 'result';
    topIds.forEach(function(id){
      var p = state.players.find(function(pl){ return pl.id === id; });
      p.scores.mlt += 1;
    });
  }
  function handleSessionUpdate(data){
    if (!state.session) return;
    state.session.data = data;
    if (state.screen === 'connect') { render(); return; }
    if (state.screen !== 'mode' || !state.modeState || !data.round || data.round.roundId !== state.session.roundId) return;
    var ms = state.modeState;
    var round = data.round;
    var changed = false;
    if ((round.kind === 'guess' || round.kind === 'hotseat') && ms.phase === 'collecting') {
      var incoming = round.answers || {};
      Object.keys(incoming).forEach(function(pid){
        var already = ms.answers.some(function(a){ return a.playerId === pid; });
        if (!already) {
          var entry = { playerId: pid, text: incoming[pid] };
          if (ms.order) entry.real = (pid === ms.order[0]);
          ms.answers.push(entry);
          changed = true;
        }
      });
    } else if (round.kind === 'vote' && ms.phase === 'voting') {
      var incomingV = round.answers || {};
      Object.keys(incomingV).forEach(function(pid){
        var already = ms.votes.some(function(v){ return v.voterId === pid; });
        if (!already) {
          ms.votes.push({ voterId: pid, targetId: incomingV[pid] });
          changed = true;
        }
      });
    } else if (round.kind === 'bottle' && round.ack && ms.phase === 'whisper-remote-wait') {
      completeBottleWhisper();
      changed = true;
    } else if (round.kind === 'paranoia' && round.ack && ms.phase === 'whisper-remote-wait') {
      completeParanoiaWhisper();
      changed = true;
    }
    if (changed) render();
  }
  function advanceTurn(){ state.turnIndex = (state.turnIndex + 1) % Math.max(state.players.length, 1); }

  function rule5Pool(level, ad){
    var easy = ad ? RULE5_EASY_AD : RULE5_EASY;
    var medium = ad ? RULE5_MEDIUM_AD : RULE5_MEDIUM;
    var hard = ad ? RULE5_HARD_AD : RULE5_HARD;
    if (level === 'easy') return easy;
    if (level === 'medium') return medium;
    if (level === 'hard') return hard;
    return easy.concat(medium).concat(hard);
  }
  function basePool(key){
    switch (key) {
      case 'mlt': return MLT.concat(state.customPrompts.mlt || []);
      case 'truth':
        var truthTier = state.depth === 'light' ? TRUTH_LIGHT : state.depth === 'deep' ? TRUTH_DEEP : TRUTH_REAL;
        return truthTier.concat(state.customPrompts.truth || []);
      case 'dare': return DARES.concat(state.customPrompts.dare || []);
      case 'guess':
        var tier = state.depth === 'light' ? GUESS_LIGHT : state.depth === 'deep' ? GUESS_DEEP : GUESS_REAL;
        return tier.concat(state.customPrompts.guess || []);
      case 'wyr': return WYR;
      case 'nhie': return NHIE;
      case 'common': return COMMON_GROUND;
      case 'newfriends': return NEW_FRIENDS;
      case 'charades': return CHARADES;
      case 'group': return GROUP_QUESTIONS;
      case 'rule5': return rule5Pool(state.rule5Level);
      case 'partners': return PARTNERS;
      case 'friends': return FRIENDS;
    }
    return [];
  }
  function adPool(key){
    switch (key) {
      case 'mlt': return MLT_AD;
      case 'truth': return state.depth === 'light' ? TRUTH_LIGHT_AD : state.depth === 'deep' ? TRUTH_DEEP_AD : TRUTH_REAL_AD;
      case 'dare': return DARE_AD;
      case 'guess': return state.depth === 'light' ? GUESS_LIGHT_AD : state.depth === 'deep' ? GUESS_DEEP_AD : GUESS_REAL_AD;
      case 'wyr': return WYR_AD;
      case 'nhie': return NHIE_AD;
      case 'charades': return [];
      case 'group': return GROUP_AD;
      case 'rule5': return rule5Pool(state.rule5Level, true);
      case 'partners': return PARTNERS_AD;
    }
    return [];
  }
  var lastDrawn = {};
  function drawFrom(subkey, pool){
    if (!state.decks[subkey] || state.decks[subkey].length === 0) {
      var fresh = shuffle(pool);
      // avoid the reshuffle boundary handing back the same card that just finished the previous cycle
      if (fresh.length > 1 && fresh[fresh.length - 1] === lastDrawn[subkey]) {
        var swapIdx = Math.floor(Math.random() * (fresh.length - 1));
        var tmp = fresh[fresh.length - 1];
        fresh[fresh.length - 1] = fresh[swapIdx];
        fresh[swapIdx] = tmp;
      }
      state.decks[subkey] = fresh;
    }
    var item = state.decks[subkey].pop();
    lastDrawn[subkey] = item;
    return item;
  }
  function draw(key){
    var base = basePool(key);
    var ad = state.afterDark ? adPool(key) : [];
    if (ad.length) {
      // weight After Dark's odds above its plain share of the pool, so it actually surfaces
      // in short sessions instead of being diluted away by the much larger base pool
      var ratio = ad.length / (base.length + ad.length);
      var chance = Math.min(ratio * 1.5, 0.5);
      if (Math.random() < chance) return drawFrom(key + ':ad', ad);
    }
    return drawFrom(key + ':base', base);
  }
  var ICEBREAKER_TYPES = ['wyr', 'nhie', 'common', 'newfriends'];
  function drawIcebreaker(){
    var type = ICEBREAKER_TYPES[Math.floor(Math.random() * ICEBREAKER_TYPES.length)];
    return { type: type, text: draw(type) };
  }

  function clearTimer(){ if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
  function clearBomb(){ if (bombTimeout) { clearTimeout(bombTimeout); bombTimeout = null; } }
  function armBomb(){
    clearBomb();
    var ms = state.modeState;
    var delay = (15 + Math.random() * 25) * 1000;
    bombTimeout = setTimeout(function(){
      bombTimeout = null;
      var eliminated = state.players.find(function(p){ return p.id === ms.activeIds[ms.holderIndex]; });
      ms.activeIds.splice(ms.holderIndex, 1);
      ms.eliminatedName = eliminated.name;
      if (ms.activeIds.length === 1) {
        var winner = state.players.find(function(p){ return p.id === ms.activeIds[0]; });
        winner.scores.charades += 1;
        ms.phase = 'winner';
        advanceTurn();
      } else {
        ms.holderIndex = ms.holderIndex % ms.activeIds.length;
        ms.phase = 'exploded';
      }
      render();
    }, delay);
  }
  function beep(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    } catch (e) {}
  }

  function focusAnswerBox(){
    var ta = document.querySelector('#screen textarea[name="answer"]');

  }

  function goHub(){

    clearBomb();

  function startMode(key){
    clearTimer();
    clearBomb();
    state.mode = key;
    state.screen = 'mode';
    if (key === 'mlt') {
      state.modeState = { prompt: draw('mlt'), resolved: false, winnerId: null, skipped: false };
    } else if (key === 'ice') {
      state.modeState = { current: drawIcebreaker() };
    } else if (key === 'guess') {
      state.modeState = { phase: 'intro', prompt: draw('guess') };
    } else if (key === 'td') {
      state.modeState = { phase: 'choose' };
    } else if (key === 'charades') {
      state.modeState = { phase: 'ready' };
    } else if (key === 'bottle') {
      var bcp = currentPlayer();
      if (isClaimed(bcp.id)) {
        var bq = draw('group');
        state.modeState = { phase: 'whisper-remote-wait', question: bq };
        startRemoteWhisper('bottle', bq, bcp.id);
      } else {
        state.modeState = { phase: 'intro' };
      }
    } else if (key === 'paranoia') {
      var pcp = currentPlayer();
      if (isClaimed(pcp.id)) {
        var pq = draw('group');
        state.modeState = { phase: 'whisper-remote-wait', question: pq, dare: null };
        startRemoteWhisper('paranoia', pq, pcp.id);
      } else {
        state.modeState = { phase: 'intro', dare: null };
      }
    } else if (key === 'vote') {
      state.modeState = { phase: 'voting', prompt: draw('mlt'), collectIndex: 0, revealed: false, votes: [] };
      if (state.session && state.session.connected) startRemoteRound('vote', state.modeState.prompt);
    } else if (key === 'hotseat') {
      state.modeState = { phase: 'choices', options: [draw('truth'), draw('truth'), draw('truth')] };
    } else if (key === 'rule5') {
      var starter = currentPlayer();
      state.modeState = {
        phase: 'reveal',
        category: draw('rule5'),
        order: [starter.id].concat(state.players.filter(function(p){ return p.id !== starter.id; }).map(function(p){ return p.id; })),
        attemptIndex: 0
      };
    } else if (key === 'bomb') {
      var bombStarter = currentPlayer();
      state.modeState = {
        phase: 'playing',
        category: draw('rule5'),
        activeIds: [bombStarter.id].concat(state.players.filter(function(p){ return p.id !== bombStarter.id; }).map(function(p){ return p.id; })),
        holderIndex: 0,
        eliminatedName: null
      };
      armBomb();
    } else if (key === 'partners') {
      state.modeState = { phase: 'pick-a' };
    } else if (key === 'friends') {
      state.modeState = { phase: 'pick-a' };
    }
    render();
  }

    }).join('');

      '<h2 class="screen-title">Connect Your Phones</h2>' +
      '<div class="connect-code">' + state.session.code + '</div>' +
      '<img class="connect-qr" src="' + qrSrc + '" width="220" height="220" alt="QR code to join the game">' +
      '<p class="screen-sub">Everyone scans this — or visits this page and taps 🔗 Join a Game with the code above — then taps their own name to claim it. It\'ll be used for Guess Who Said It and Hot Seat so answers stay private.</p>' +
      '<div class="remote-list">' + roster + '</div>' +
      '<button class="btn btn-primary btn-block btn-lg" type="button" data-action="connect-continue">Continue to Party 🎉</button>' +
      '<button class="btn btn-ghost btn-block" type="button" data-action="connect-skip">Skip — pass the phone instead</button>'

            '<span><span class="mode-title">' + esc(m.label) + '</span><br><span class="mode-desc">' + esc(m.desc) + '</span></span>' +
          '</button>'
        );

        '<div class="mode-section">' +
          '<h3 class="mode-section-title">' + esc(group.label) + '</h3>' +

  function renderIce(){

  // Live "phones" checklist shown on the host screen instead of the pass-the-phone

  function renderCollectingRemote(ms, m, expectedIds, formName, promptText, kickerLabel){
    if (ms.fallbackFor) {
      var fp = state.players.find(function(pl){ return pl.id === ms.fallbackFor; });
      return (
        '<div class="prompt-card" style="--mc:' + m.color + '"><div class="kicker">Answering for ' + esc(fp.name) + '</div><div class="prompt-text">' + esc(promptText) + '</div></div>' +
        '<form data-form="' + formName + '">' +
          '<textarea class="textarea" name="answer" placeholder="Type their answer…"></textarea>' +
          '<button class="btn btn-primary btn-block" style="margin-top:8px" type="submit">Submit</button>' +
        '</form>'
      );
    }
    var rows = expectedIds.map(function(pid){
      var p = state.players.find(function(pl){ return pl.id === pid; });
      var got = ms.answers.some(function(a){ return a.playerId === pid; });
      return '<div class="remote-row' + (got ? ' done' : '') + '"><span>' + (got ? '✅' : '⏳') + ' ' + esc(p.name) + '</span>' +
        (got ? '' : '<button class="btn btn-ghost btn-sm" type="button" data-action="remote-fallback" data-id="' + pid + '">Type for them</button>') +
        '</div>';
    }).join('');
    var allDone = expectedIds.every(function(pid){ return ms.answers.some(function(a){ return a.playerId === pid; }); });
    return (
      '<div class="prompt-card" style="--mc:' + m.color + '"><div class="kicker">' + kickerLabel + '</div><div class="prompt-text">' + esc(promptText) + '</div></div>' +
      '<p class="screen-sub">📡 Answers come in privately on each phone. Room code <strong>' + esc(state.session.code) + '</strong>.</p>' +
      '<div class="remote-list">' + rows + '</div>' +
      (allDone ? '<button class="btn btn-primary btn-block" type="button" data-action="remote-continue">Continue</button>' : '')
    );
  }

  function renderGuess(){
    var ms = state.modeState;
    var m = MODE_META.guess;
    if (ms.phase === 'intro') {
      return (
        '<div class="prompt-card" style="--mc:' + m.color + '"><div class="kicker">Guess Who Said It</div><div class="prompt-text">' + esc(ms.prompt) + '</div></div>' +
        '<p class="screen-sub">Everyone answers honestly, in private. Then everyone finds out who said what.</p>' +
        '<button class="btn btn-primary btn-block" type="button" data-action="guess-collect-start">Start Collecting Answers</button>'
      );
    }
    if (ms.phase === 'collecting') {
      if (state.session && state.session.connected) {
        return renderCollectingRemote(ms, m, state.players.map(function(p){ return p.id; }), 'guess-answer', ms.prompt, 'Guess Who Said It');
      }
      var p = state.players[ms.collectIndex];
      var progress = '(' + (ms.collectIndex + 1) + ' of ' + state.players.length + ')';
      if (!ms.revealed) {
        return (
          '<div class="cover-card"><span class="big-emoji">🤫</span><div>Pass the phone to<br><strong>' + esc(p.name) + '</strong><br><span class="progress-note">' + progress + '</span></div><button class="btn btn-primary" type="button" data-action="guess-reveal-input">I\'m ready</button></div>'
        );
      }
      return (
        '<div class="prompt-card" style="--mc:' + m.color + '"><div class="kicker">' + esc(p.name) + ', answer honestly ' + progress + '</div><div class="prompt-text">' + esc(ms.prompt) + '</div></div>' +
        '<form data-form="guess-answer">' +
          '<textarea class="textarea" name="answer" placeholder="Type your answer…"></textarea>' +
          '<button class="btn btn-primary btn-block" style="margin-top:8px" type="submit">Submit Secretly</button>' +
          '<p class="kbd-hint">⌘/Ctrl + Enter submits</p>' +
        '</form>'
      );
    }
    if (ms.phase === 'guessing') {
      var entry = ms.shuffled[ms.guessPointer];
      if (!ms.guessResult) {
        return (
          '<div class="prompt-card" style="--mc:' + m.color + '"><div class="kicker">Answer ' + (ms.guessPointer + 1) + ' of ' + ms.shuffled.length + '</div><div class="prompt-text">“' + esc(entry.text) + '”</div></div>' +
          '<p class="screen-sub">Who wrote this?</p>' +
          '<div class="name-grid">' + screenPlayers('guess-pick') + '</div>'
        );
      }
      var author = state.players.find(function(pl){ return pl.id === entry.playerId; });
      var correct = ms.guessResult === entry.playerId;
      return (
        '<div class="result-banner"><div class="headline">' + (correct ? '✅ Correct!' : '❌ Not quite.') + '</div><div class="sub">It was <strong>' + esc(author.name) + '</strong>: “' + esc(entry.text) + '”</div></div>' +
        '<button class="btn btn-primary btn-block" type="button" data-action="guess-next">' + (ms.guessPointer + 1 < ms.shuffled.length ? 'Next Answer' : 'See Round Recap') + '</button>'
      );
    }
    return (
      '<div class="result-banner"><div class="headline">🎉 That\'s everyone!</div><div class="sub">You correctly guessed ' + ms.roundCorrect + ' of ' + ms.shuffled.length + ' this round.</div></div>' +
      knowEachOtherLine() +
      '<button class="btn btn-primary btn-block" type="button" data-action="go-hub">Back to Hub</button>'
    );
  }

      );

        '<div class="turn-banner" style="--mc:' + m.color + '"><span style="font-size:20px">🪑</span><div><div class="label">In the hot seat</div><div class="name">' + esc(hotseat.name) + '</div></div></div>' +
        '<p class="screen-sub">' + esc(hotseat.name) + ', pick one question to read aloud.</p>' +
        '<div class="name-grid" style="grid-template-columns:1fr">' + ms.options.map(function(q, idx){
          return '<button class="name-btn" type="button" data-action="hotseat-choose" data-idx="' + idx + '" style="text-align:left">' + esc(q) + '</button>';
        }).join('') + '</div>'
      );
    }
    if (ms.phase === 'collecting') {
      if (state.session && state.session.connected) {
        return renderCollectingRemote(ms, m, ms.order, 'hotseat-answer', ms.question, 'Hot Seat Question');
      }
      var pid = ms.order[ms.collectIndex];
      var p = state.players.find(function(pl){ return pl.id === pid; });
      var isHotseat = ms.collectIndex === 0;
      var progressH = '(' + (ms.collectIndex + 1) + ' of ' + ms.order.length + ')';
      if (!ms.revealed) {
        return '<div class="cover-card" style="--mc:' + m.color + '"><span class="big-emoji">🪑</span><div>Pass the phone to<br><strong>' + esc(p.name) + '</strong><br><span class="progress-note">' + progressH + '</span></div><button class="btn btn-primary" type="button" data-action="hotseat-reveal-input">I\'m ready</button></div>';
      }
      return (
        '<div class="prompt-card" style="--mc:' + m.color + '"><div class="kicker">' + (isHotseat ? 'Your real answer' : 'Channel ' + esc(hotseat.name)) + ' ' + progressH + '</div><div class="prompt-text">' + esc(ms.question) + '</div></div>' +
        '<form data-form="hotseat-answer">' +
          '<textarea class="textarea" name="answer" placeholder="' + esc(isHotseat ? 'What would you actually say?' : 'What would ' + hotseat.name + ' say?') + '"></textarea>' +
          '<button class="btn btn-primary btn-block" style="margin-top:8px" type="submit">Submit Secretly</button>' +
          '<p class="kbd-hint">⌘/Ctrl + Enter submits</p>' +
        '</form>'
      );
    }
    if (ms.phase === 'guessing') {
      var list = ms.shuffled.map(function(a, i){
        var isReal = ms.revealedReal && a.real;
        return '<div class="answer-row' + (isReal ? ' real' : '') + '" style="--mc:' + m.color + '"><span class="num">' + (isReal ? '✅' : (i + 1) + '.') + '</span><span>' + esc(a.text) + '</span></div>';
      }).join('');
      return (
        '<div class="prompt-card" style="--mc:' + m.color + '"><div class="kicker">Hot Seat</div><div class="prompt-text">' + esc(ms.question) + '</div></div>' +
        '<div class="answer-list">' + list + '</div>' +
        (!ms.revealedReal
          ? '<p class="screen-sub">' + esc(hotseat.name) + ' reads these all out loud. Everyone else calls out their guess for the real one.</p><button class="btn btn-primary btn-block" type="button" data-action="hotseat-reveal-real">🔍 Reveal the Real Answer</button>'
          : '<p class="screen-sub">Did the group guess right?</p><div class="btn-row"><button class="btn btn-primary" type="button" data-action="hotseat-score" data-outcome="correct">✅ Yes</button><button class="btn" type="button" data-action="hotseat-score" data-outcome="fooled">❌ Someone got fooled</button></div>')
      );
    }
    if (ms.phase === 'pick-fooler') {
      var foolers = state.players.filter(function(pl){ return pl.id !== hotseat.id; });
      return (
        '<p class="screen-sub">Whose fake answer fooled people?</p>' +
        '<div class="name-grid">' + foolers.map(function(pl){ return '<button class="name-btn" type="button" data-action="hotseat-pick-fooler" data-id="' + pl.id + '">' + esc(pl.name) + '</button>'; }).join('') + '</div>'
      );
    }
    return (
      '<div class="result-banner"><div class="headline">' + esc(ms.resultMsg) + '</div></div>' +
      knowEachOtherLine() +
      '<button class="btn btn-primary btn-block" type="button" data-action="go-hub">Back to Hub</button>'
    );
  }

  function renderBomb(){

  function renderMode(){

      case 'mlt': return renderMlt();
      case 'ice': return renderIce();
      case 'guess': return renderGuess();
      case 'td': return renderTd();
      case 'charades': return renderCharades();
      case 'bottle': return renderBottle();
      case 'paranoia': return renderParanoia();
      case 'vote': return renderVote();
      case 'hotseat': return renderHotSeat();
      case 'rule5': return renderRule5();
      case 'bomb': return renderBomb();
      case 'partners': return renderPartners();
      case 'friends': return renderFriends();

    return '';

      '<p class="screen-sub">Talk it through together — no scoring, no rush.</p>' +

  var AWARD_DEFS = [
    { key:'mlt', title:'Most Likely To Everything', medal:'🌟' },
    { key:'truth', title:'Most Open Book', medal:'📖' },
    { key:'dare', title:'Bravest Soul', medal:'🔥' },
    { key:'charades', title:'Charades Champion', medal:'🎭' },
    { key:'mystery', title:'Most Mysterious', medal:'🕵️' }
  ];

  function renderAwards(){
    var anyScore = state.players.some(function(p){ return totalScore(p) > 0; });
    if (!state.players.length || !anyScore) {
      return (
        '<div class="empty-state"><span class="big-emoji">🏆</span><h2 class="screen-title">Nobody has bragging rights yet</h2><p class="screen-sub">Play a round, then come back and see who\'s officially the worst.</p></div>' +
        '<button class="btn btn-primary btn-block" type="button" data-action="go-hub">Back to Game</button>'
      );
    }
    var maxTotal = Math.max.apply(null, state.players.map(totalScore));
    var mvps = state.players.filter(function(p){ return totalScore(p) === maxTotal; });
    var confetti = ['🎉','✨','🎊','🔥','🌟'].map(function(e, i){
      return '<span style="top:' + (10 + i * 14) + '%; left:' + (8 + i * 20) + '%; animation-delay:' + (i * 0.3) + 's">' + e + '</span>';
    }).join('');
    var rows = AWARD_DEFS.map(function(def){
      var max = Math.max.apply(null, state.players.map(function(p){ return p.scores[def.key]; }));
      if (max === 0) {
        return '<div class="awards-row muted"><span class="medal">' + def.medal + '</span><div class="info"><div class="award-title">' + def.title + '</div><div class="award-winner">Not played yet</div></div></div>';
      }
      var winners = state.players.filter(function(p){ return p.scores[def.key] === max; }).map(function(p){ return p.name; }).join(' & ');
      return '<div class="awards-row"><span class="medal">' + def.medal + '</span><div class="info"><div class="award-title">' + def.title + '</div><div class="award-winner">' + esc(winners) + '</div></div><div class="count">' + max + '</div></div>';
    }).join('');
    var statLine = knowEachOtherLine();
    return (
      '<h2 class="screen-title">🏁 Party\'s Over</h2>' +
      '<div class="awards-mvp"><div class="confetti" aria-hidden="true">' + confetti + '</div><div class="crown">👑</div><div class="name">' + esc(mvps.map(function(p){ return p.name; }).join(' & ')) + '</div><div class="caption">Party MVP · ' + maxTotal + (maxTotal === 1 ? ' point' : ' points') + '</div></div>' +
      '<div class="awards-list">' + rows + '</div>' +
      statLine +
      '<div class="btn-row"><button class="btn" type="button" data-action="reset-scores">Reset Scores</button><button class="btn btn-primary" type="button" data-action="go-hub">↩️ Keep Playing</button></div>' +
      '<button class="btn btn-ghost btn-block" type="button" data-action="new-players">New Players</button>'
    );
  }

  function render(){
    var html;
    if (state.screen === 'setup') html = renderSetup();
    else if (state.screen === 'connect') html = renderConnect();
    else if (state.screen === 'hub') html = renderHub();
    else if (state.screen === 'mode') html = renderMode();
    else if (state.screen === 'awards') html = renderAwards();
    var el = document.getElementById('screen');
    el.innerHTML = '<div class="fade-in">' + html + '</div>';
    renderBrandChrome();
  }

  function handleAction(action, btn){
    if (action === 'set-depth') {
      state.depth = btn.dataset.depth;
      saveStorage();
      render(); return;
    }
    if (action === 'set-rule5-level') {
      state.rule5Level = btn.dataset.level;
      saveStorage();
      render(); return;
    }
    if (action === 'toggle-settings') {
      state.settingsOpen = !state.settingsOpen;
      render(); return;
    }
    if (action === 'toggle-afterdark') {
      state.afterDark = !state.afterDark;
      saveStorage();
      render(); return;
    }
    if (action === 'toggle-connect') {
      state.connectPhones = !state.connectPhones;
      saveStorage();
      render(); return;
    }
    if (action === 'remove-player') {
      state.players = state.players.filter(function(p){ return p.id !== btn.dataset.id; });
      saveStorage(); render(); return;
    }
    if (action === 'start-party') {
      document.querySelectorAll('[data-custom]').forEach(function(t){
        var key = t.dataset.custom;
        state.customPrompts[key] = t.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      });
      saveStorage();
      state.decks = {};
      lastDrawn = {};
      state.turnIndex = 0;
      state.players.forEach(function(p){ p.scores = { mlt:0, truth:0, dare:0, charades:0, mystery:0 }; });
      state.stats = { guessRoundsPlayed:0, guessRoundsCorrect:0, hotseatRoundsPlayed:0, hotseatRoundsCorrect:0 };
      if (state.connectPhones) {
        state.screen = 'connect';
        render();
        createSession();
      } else {
        state.screen = 'hub';
        render();
      }
      return;
    }
    if (action === 'connect-continue') { state.screen = 'hub'; render(); return; }
    if (action === 'connect-skip') {
      if (state.session && state.session.unsub) state.session.unsub();
      state.session = null;
      state.connectPhones = false;
      state.screen = 'hub';
      render(); return;
    }
    if (action === 'remote-fallback') {
      state.modeState.fallbackFor = btn.dataset.id;
      render(); focusAnswerBox(); return;
    }
    if (action === 'remote-continue') {
      var msRc = state.modeState;
      msRc.shuffled = shuffle(msRc.answers);
      msRc.phase = 'guessing';
      if (state.mode === 'guess') { msRc.guessPointer = 0; msRc.guessResult = null; msRc.roundCorrect = 0; }
      else { msRc.revealedReal = false; }
      render(); return;
    }
    if (action === 'pick-mode') { startMode(btn.dataset.mode); return; }
    if (action === 'show-awards') { state.screen = 'awards'; render(); return; }
    if (action === 'go-hub') { goHub(); return; }
    if (action === 'reset-scores') {
      state.players.forEach(function(p){ p.scores = { mlt:0, truth:0, dare:0, charades:0, mystery:0 }; });
      state.stats = { guessRoundsPlayed:0, guessRoundsCorrect:0, hotseatRoundsPlayed:0, hotseatRoundsCorrect:0 };
      state.turnIndex = 0;
      goHub(); return;
    }
    if (action === 'new-players') {
      if (!confirmNewPlayers) {
        confirmNewPlayers = true;
        btn.textContent = 'Tap again to confirm';
        setTimeout(function(){ confirmNewPlayers = false; }, 3000);
        return;
      }
      confirmNewPlayers = false;
      state.players = [];
      state.turnIndex = 0;
      state.screen = 'setup';
      saveStorage();
      render(); return;
    }

    // Most Likely To
    if (action === 'mlt-pick') {
      var mp = state.players.find(function(p){ return p.id === btn.dataset.id; });
      mp.scores.mlt += 1;
      state.modeState.resolved = true;
      state.modeState.winnerId = mp.id;
      render(); return;
    }
    if (action === 'mlt-skip') {
      state.modeState.resolved = true;
      state.modeState.winnerId = null;
      render(); return;
    }

    // Icebreakers
    if (action === 'ice-next') { state.modeState.current = drawIcebreaker(); render(); return; }

    // Guess Who Said It
    if (action === 'guess-collect-start') {
      state.modeState.phase = 'collecting';
      state.modeState.collectIndex = 0;
      state.modeState.answers = [];
      state.modeState.revealed = false;
      state.modeState.fallbackFor = null;
      startRemoteRound('guess', state.modeState.prompt);
      render(); return;
    }
    if (action === 'guess-reveal-input') { state.modeState.revealed = true; render(); focusAnswerBox(); return; }
    if (action === 'guess-pick') {
      var ms = state.modeState;
      ms.guessResult = btn.dataset.id;
      var entry = ms.shuffled[ms.guessPointer];
      ms.roundCorrect = ms.roundCorrect || 0;
      state.stats.guessRoundsPlayed += 1;
      if (ms.guessResult === entry.playerId) {
        ms.roundCorrect += 1;
        state.stats.guessRoundsCorrect += 1;
      } else {
        var author = state.players.find(function(p){ return p.id === entry.playerId; });
        author.scores.mystery += 1;
      }
      render(); return;
    }
    if (action === 'guess-next') {
      var ms2 = state.modeState;
      ms2.guessResult = null;
      if (ms2.guessPointer + 1 < ms2.shuffled.length) {
        ms2.guessPointer += 1;
      } else {
        ms2.phase = 'roundEnd';
      }
      render(); return;
    }

    // Truth or Dare
    if (action === 'td-truth') { state.modeState.phase = 'truth'; state.modeState.prompt = draw('truth'); render(); return; }
    if (action === 'td-dare') { state.modeState.phase = 'dare'; state.modeState.prompt = draw('dare'); render(); return; }
    if (action === 'td-done') {
      var field = btn.dataset.field;
      var cp = currentPlayer();
      if (field === 'truth') cp.scores.truth += 1;
      if (field === 'dare') cp.scores.dare += 1;
      state.modeState.lastName = cp.name;
      state.modeState.phase = 'done';
      advanceTurn();
      render(); return;
    }

    // Charades
    if (action === 'cha-reveal') { state.modeState.phase = 'reveal'; state.modeState.word = draw('charades'); render(); return; }
    if (action === 'cha-start') {
      state.modeState.phase = 'timer';
      state.modeState.timeLeft = 60;
      render();
      clearTimer();
      timerInterval = setInterval(function(){
        state.modeState.timeLeft -= 1;
        if (state.modeState.timeLeft <= 0) {
          clearTimer();
          beep();
          state.modeState.phase = 'result';
          state.modeState.success = false;
          advanceTurn();
        }
        render();
      }, 1000);
      return;
    }
    if (action === 'cha-got-it') {
      clearTimer();
      currentPlayer().scores.charades += 1;
      state.modeState.phase = 'result';
      state.modeState.success = true;
      advanceTurn();
      render(); return;
    }

    // Bottle Up
    if (action === 'bottle-reveal') {
      state.modeState.phase = 'whisper';
      state.modeState.question = draw('group');
      render(); return;
    }
    if (action === 'bottle-whispered') { completeBottleWhisper(); render(); return; }
    if (action === 'bottle-flip') {
      state.modeState.phase = 'result';
      state.modeState.heads = Math.random() < 0.5;
      advanceTurn();
      render(); return;
    }

    // Paranoia
    if (action === 'paranoia-reveal') {
      state.modeState.phase = 'whisper';
      state.modeState.question = draw('group');
      render(); return;
    }
    if (action === 'paranoia-whispered') {
      completeParanoiaWhisper();
      render(); return;
    }
    if (action === 'whisper-remote-fallback') { state.modeState.phase = 'whisper'; render(); return; }
    if (action === 'paranoia-dare') {
      state.modeState.dare = draw('dare');
      render(); return;
    }

    // The Voting Game
    if (action === 'vote-reveal') { state.modeState.revealed = true; render(); return; }
    if (action === 'vote-pick') {
      var ms3 = state.modeState;
      ms3.votes.push({ voterId: state.players[ms3.collectIndex].id, targetId: btn.dataset.id });
      ms3.collectIndex += 1;
      ms3.revealed = false;
      if (ms3.collectIndex >= state.players.length) {
        computeVoteTally(ms3);
      }
      render(); return;
    }
    if (action === 'vote-pick-fallback') {
      var ms3b = state.modeState;
      ms3b.votes.push({ voterId: ms3b.fallbackFor, targetId: btn.dataset.id });
      ms3b.fallbackFor = null;
      render(); return;
    }
    if (action === 'remote-vote-continue') {
      computeVoteTally(state.modeState);
      render(); return;
    }
    if (action === 'vote-reveal-voters') { state.modeState.votersRevealed = true; render(); return; }

    // Hot Seat
    if (action === 'hotseat-choose') {
      var msH1 = state.modeState;
      msH1.question = msH1.options[Number(btn.dataset.idx)];
      var hs = currentPlayer();
      msH1.order = [hs.id].concat(state.players.filter(function(p){ return p.id !== hs.id; }).map(function(p){ return p.id; }));
      msH1.collectIndex = 0;
      msH1.revealed = false;
      msH1.answers = [];
      msH1.fallbackFor = null;
      msH1.phase = 'collecting';
      startRemoteRound('hotseat', msH1.question);
      render(); return;
    }
    if (action === 'hotseat-reveal-input') { state.modeState.revealed = true; render(); focusAnswerBox(); return; }
    if (action === 'hotseat-reveal-real') { state.modeState.revealedReal = true; render(); return; }
    if (action === 'hotseat-score') {
      var msH2 = state.modeState;
      state.stats.hotseatRoundsPlayed += 1;
      if (btn.dataset.outcome === 'correct') {
        state.stats.hotseatRoundsCorrect += 1;
        currentPlayer().scores.truth += 1;
        msH2.resultMsg = currentPlayer().name + ' really is an open book.';
        msH2.phase = 'result';
        advanceTurn();
        render();
      } else {
        msH2.phase = 'pick-fooler';
        render();
      }
      return;
    }
    if (action === 'hotseat-pick-fooler') {
      var fooler = state.players.find(function(p){ return p.id === btn.dataset.id; });
      fooler.scores.mystery += 1;
      state.modeState.resultMsg = fooler.name + ' fooled the room. Smooth.';
      state.modeState.phase = 'result';
      advanceTurn();
      render(); return;
    }

    // 5 Second Rule
    if (action === 'rule5-start') {
      state.modeState.phase = 'timer';
      state.modeState.timeLeft = 5;
      render();
      clearTimer();
      timerInterval = setInterval(function(){
        var ms5 = state.modeState;
        ms5.timeLeft -= 1;
        if (ms5.timeLeft <= 0) {
          clearTimer();
          beep();
          if (ms5.attemptIndex < ms5.order.length - 1) {
            ms5.attemptIndex += 1;
            ms5.phase = 'reveal';
          } else {
            ms5.phase = 'result';
            ms5.outcome = 'failed-all';
            advanceTurn();
          }
        }
        render();
      }, 1000);
      return;
    }
    if (action === 'rule5-got-it') {
      clearTimer();
      var ms6 = state.modeState;
      var winner = state.players.find(function(p){ return p.id === ms6.order[ms6.attemptIndex]; });
      winner.scores.charades += 1;
      ms6.phase = 'result';
      ms6.outcome = 'success';
      advanceTurn();
      render(); return;
    }

    // Pass the Bomb
    if (action === 'bomb-pass') {
      var msB = state.modeState;
      msB.holderIndex = (msB.holderIndex + 1) % msB.activeIds.length;
      render(); return;
    }
    if (action === 'bomb-next') {
      var msB2 = state.modeState;
      msB2.category = draw('rule5');
      msB2.phase = 'playing';
      armBomb();
      render(); return;
    }

    // Partners
    if (action === 'partners-pick-a') {
      state.modeState.aId = btn.dataset.id;
      state.modeState.phase = 'pick-b';
      render(); return;
    }
    if (action === 'partners-pick-b') {
      state.modeState.bId = btn.dataset.id;
      state.modeState.phase = 'prompt';
      state.modeState.prompt = draw('partners');
      render(); return;
    }
    if (action === 'partners-next') {
      state.modeState.prompt = draw('partners');
      render(); return;
    }

    // Friends
    if (action === 'friends-pick-a') {
      state.modeState.aId = btn.dataset.id;
      state.modeState.phase = 'pick-b';
      render(); return;
    }
    if (action === 'friends-pick-b') {
      state.modeState.bId = btn.dataset.id;
      state.modeState.phase = 'prompt';
      state.modeState.prompt = draw('friends');
      render(); return;
    }
    if (action === 'friends-next') {
      state.modeState.prompt = draw('friends');
      render(); return;
    }
  }

  document.getElementById('screen').addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if (btn) handleAction(btn.dataset.action, btn);
  });

  document.getElementById('screen').addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      var form = e.target.closest('form');
      if (form && (form.dataset.form === 'guess-answer' || form.dataset.form === 'hotseat-answer')) {
        e.preventDefault();
        form.requestSubmit();
      }
    }
  });

  document.getElementById('screen').addEventListener('submit', function(e){
    var form = e.target.closest('form');
    if (!form) return;
    e.preventDefault();
    if (form.dataset.form === 'add-player') {
      var input = form.querySelector('input[name="name"]');
      var name = input.value.trim();
      if (name) {
        state.players.push(newPlayer(name));
        saveStorage();
        input.value = '';
        render();
        var next = document.querySelector('[data-form="add-player"] input');
        if (next) next.focus();
      }
      return;
    }
    if (form.dataset.form === 'guess-answer') {
      var ta = form.querySelector('textarea[name="answer"]');
      var text = ta.value.trim();
      if (!text) return;
      var ms = state.modeState;
      if (ms.fallbackFor) {
        ms.answers.push({ playerId: ms.fallbackFor, text: text });
        ms.fallbackFor = null;
        render();
        return;
      }
      ms.answers.push({ playerId: state.players[ms.collectIndex].id, text: text });
      ms.collectIndex += 1;
      ms.revealed = false;
      if (ms.collectIndex >= state.players.length) {
        ms.shuffled = shuffle(ms.answers);
        ms.phase = 'guessing';
        ms.guessPointer = 0;
        ms.guessResult = null;
        ms.roundCorrect = 0;
      }
      render();
    }
    if (form.dataset.form === 'hotseat-answer') {
      var taH = form.querySelector('textarea[name="answer"]');
      var textH = taH.value.trim();
      if (!textH) return;
      var msH = state.modeState;
      if (msH.fallbackFor) {
        msH.answers.push({ playerId: msH.fallbackFor, text: textH, real: msH.fallbackFor === msH.order[0] });
        msH.fallbackFor = null;
        render();
        return;
      }
      var pid = msH.order[msH.collectIndex];
      msH.answers.push({ playerId: pid, text: textH, real: msH.collectIndex === 0 });
      msH.collectIndex += 1;
      msH.revealed = false;
      if (msH.collectIndex >= msH.order.length) {
        msH.shuffled = shuffle(msH.answers);
        msH.phase = 'guessing';
        msH.revealedReal = false;
      }
      render();
    }
  });

  // ---- Player-side join page (rendered when ?join=CODE is present) ----
  function initJoinView(code){
    var screenEl = document.getElementById('screen');
    if (!firebaseDb) {
      screenEl.innerHTML = '<div class="join-wrap"><h2 class="screen-title">Can\'t Connect</h2><p class="screen-sub">This page couldn\'t reach the game server. Check your internet connection and reload.</p></div>';
      return;
    }
    var storageKey = 'rr_join_' + code;
    var myPlayerId = sessionStorage.getItem(storageKey) || null;
    var ref = firebaseDb.collection('sessions').doc(code);
    var latestData = null;

    function claim(pid){
      var update = {};
      update['players.' + pid + '.claimed'] = true;
      ref.update(update).then(function(){
        myPlayerId = pid;
        sessionStorage.setItem(storageKey, pid);
        paint();
      }).catch(function(err){
        console.warn('claim failed', err);
        alert('Could not claim that name — try again.');
      });
    }

    function paint(){
      if (!latestData) {
        screenEl.innerHTML = '<div class="join-wrap"><p class="screen-sub">Loading…</p></div>';
        return;
      }
      var players = latestData.players || {};
      if (!myPlayerId || !players[myPlayerId]) {
        var names = Object.keys(players).map(function(pid){
          var pl = players[pid];
          return '<button class="name-btn join-name-btn" type="button" data-pid="' + pid + '"' + (pl.claimed ? ' disabled style="opacity:0.4"' : '') + '>' + esc(pl.name) + (pl.claimed ? ' (taken)' : '') + '</button>';
        }).join('');
        screenEl.innerHTML =
          '<div class="join-wrap">' +
            '<h2 class="screen-title">Who are you?</h2>' +
            '<p class="screen-sub">Tap your name to join the game on this phone.</p>' +
            '<div class="name-grid" style="grid-template-columns:1fr">' + names + '</div>' +
          '</div>';
        screenEl.querySelectorAll('[data-pid]').forEach(function(btn){
          if (!btn.disabled) btn.addEventListener('click', function(){ claim(btn.dataset.pid); });
        });
        return;
      }
      var myName = players[myPlayerId].name;
      var round = latestData.round;
      if (!round) {
        screenEl.innerHTML =
          '<div class="join-wrap">' +
            '<h2 class="screen-title">You\'re in, ' + esc(myName) + '!</h2>' +
            '<p class="screen-sub">Waiting for the host to start a round that needs your phone…</p>' +
          '</div>';
        return;
      }

      if (round.kind === 'bottle' || round.kind === 'paranoia') {
        if (round.targetPlayerId !== myPlayerId) {
          screenEl.innerHTML =
            '<div class="join-wrap">' +
              '<h2 class="screen-title">You\'re in, ' + esc(myName) + '!</h2>' +
              '<p class="screen-sub">Waiting for the host to start a round that needs your phone…</p>' +
            '</div>';
          return;
        }
        if (round.ack) {
          screenEl.innerHTML =
            '<div class="join-wrap">' +
              '<h2 class="screen-title">✅ Got it</h2>' +
              '<p class="screen-sub">Go ahead and whisper it — the host screen will move on.</p>' +
            '</div>';
          return;
        }
        screenEl.innerHTML =
          '<div class="join-wrap">' +
            '<div class="prompt-card"><div class="kicker">Your question, ' + esc(myName) + '</div><div class="prompt-text">' + esc(round.prompt) + '</div></div>' +
            '<p class="screen-sub">Whisper it to whoever\'s next to you, then tap below.</p>' +
            '<button class="btn btn-primary btn-block" id="whisperedBtn" type="button">Whispered it 🤫</button>' +
          '</div>';
        document.getElementById('whisperedBtn').addEventListener('click', function(){
          ref.update({ 'round.ack': true }).catch(function(err){ console.warn('ack failed', err); });
        });
        return;
      }

      if (round.kind === 'vote') {
        var alreadyV = round.answers && Object.prototype.hasOwnProperty.call(round.answers, myPlayerId);
        if (alreadyV) {
          screenEl.innerHTML =
            '<div class="join-wrap">' +
              '<h2 class="screen-title">✅ Voted</h2>' +
              '<p class="screen-sub">Waiting for everyone else to vote…</p>' +
            '</div>';
          return;
        }
        var voteNames = Object.keys(players).map(function(pid){
          return '<button class="name-btn join-name-btn" type="button" data-vote-target="' + pid + '">' + esc(players[pid].name) + '</button>';
        }).join('');
        screenEl.innerHTML =
          '<div class="join-wrap">' +
            '<div class="prompt-card"><div class="kicker">The Voting Game</div><div class="prompt-text">' + esc(round.prompt) + '</div></div>' +
            '<p class="screen-sub">Vote for whoever fits — yourself included. Nobody else should see this.</p>' +
            '<div class="name-grid" style="grid-template-columns:1fr">' + voteNames + '</div>' +
          '</div>';
        screenEl.querySelectorAll('[data-vote-target]').forEach(function(btn){
          btn.addEventListener('click', function(){
            var upd = {};
            upd['round.answers.' + myPlayerId] = btn.dataset.voteTarget;
            ref.update(upd).catch(function(err){ console.warn('vote submit failed', err); alert('Could not submit — check your connection and try again.'); });
          });
        });
        return;
      }

      var already = round.answers && Object.prototype.hasOwnProperty.call(round.answers, myPlayerId);
      if (already) {
        screenEl.innerHTML =
          '<div class="join-wrap">' +
            '<h2 class="screen-title">✅ Submitted</h2>' +
            '<p class="screen-sub">Waiting for everyone else to finish answering…</p>' +
          '</div>';
        return;
      }
      var kicker = round.kind === 'hotseat' ? 'Hot Seat Question' : 'Guess Who Said It';
      screenEl.innerHTML =
        '<div class="join-wrap">' +
          '<div class="prompt-card"><div class="kicker">' + kicker + '</div><div class="prompt-text">' + esc(round.prompt) + '</div></div>' +
          '<form id="joinAnswerForm">' +
            '<textarea class="textarea" name="answer" placeholder="Type your answer…"></textarea>' +
            '<button class="btn btn-primary btn-block" style="margin-top:8px" type="submit">Submit Secretly</button>' +
          '</form>' +
        '</div>';
      var form = document.getElementById('joinAnswerForm');
      form.addEventListener('submit', function(e){
        e.preventDefault();
        var ta = form.querySelector('textarea[name="answer"]');
        var text = ta.value.trim();
        if (!text) return;
        var update = {};
        update['round.answers.' + myPlayerId] = text;
        ref.update(update).catch(function(err){ console.warn('submit failed', err); alert('Could not submit — check your connection and try again.'); });
      });
    }

    ref.get().then(function(snap){
      if (!snap.exists) {
        screenEl.innerHTML = '<div class="join-wrap"><h2 class="screen-title">Room Not Found</h2><p class="screen-sub">Ask the host for a fresh QR code — this one may have expired.</p></div>';
        return;
      }
      latestData = snap.data();
      paint();
      ref.onSnapshot(function(s){
        if (s.exists) { latestData = s.data(); paint(); }
      }, function(err){ console.warn('join listen error', err); });
    }).catch(function(err){
      console.warn('join load failed', err);
      screenEl.innerHTML = '<div class="join-wrap"><h2 class="screen-title">Can\'t Connect</h2><p class="screen-sub">Check your internet connection and reload.</p></div>';
    });
  }

  render();
})();
</script>
